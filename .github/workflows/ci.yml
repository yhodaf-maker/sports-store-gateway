name: PR Quality

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            printf 'Invalid branch name: %s\n' "$BRANCH_NAME"
            printf 'Use feature/, bugfix/, or hotfix/ followed by a lowercase kebab-case slug.\n'
            exit 1
          fi

  reviewer-tests:
    name: Workflow and reviewer tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install reviewer test dependencies
        run: python -m pip install httpx pydantic pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  quality:
    name: ESLint and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  secrets:
    name: Gitleaks pull request scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full pull request history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          mkdir --parents "${RUNNER_TEMP}/bin"
          install "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          printf '%s\n' "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan pull request commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan current repository files
        run: gitleaks dir --redact --verbose .

  configuration:
    name: Checkov configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan Dockerfile
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3107.0
        with:
          file: Dockerfile
          framework: dockerfile
          output_format: cli
          soft_fail: false

  image:
    name: Build and scan local image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build local image
        run: docker build --tag sports-store-gateway:ci .

      - name: Scan patched high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sports-store-gateway:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sast:
    name: Semgrep SAST (report only)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
      SEMGREP_VERSION: 1.172.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned Semgrep version
        run: |
          actual_version="$(docker run --rm "$SEMGREP_IMAGE" semgrep --version)"
          test "$actual_version" = "$SEMGREP_VERSION"

      # Full report-only scan for the initial tuning phase. Findings are printed
      # to the job log without failing the job. Scanner/configuration
      # failures retain the nonzero exit code returned by docker run.
      - name: Run Semgrep full scan (report only)
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config auto .

  sca:
    name: Dependency SCA (report only)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm

      # npm uses exit 1 for findings. A valid audit report is required before
      # that status is accepted; malformed output and tool failures block CI.
      - name: Audit all and production dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-sca"

          set +e
          npm audit --json > "$RUNNER_TEMP/dependency-sca/npm-audit-all.json"
          all_status=$?
          set -e
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!d.metadata?.vulnerabilities || !d.vulnerabilities) throw new Error("invalid npm audit report"); console.log(`all dependencies: ${d.metadata.vulnerabilities.total} known vulnerabilities`); Object.entries(d.vulnerabilities).forEach(([name,v]) => console.log(`  ${name}: ${v.severity}`))' "$RUNNER_TEMP/dependency-sca/npm-audit-all.json"
          case "$all_status" in
            0) ;;
            1) echo "All-dependency vulnerabilities are report-only." ;;
            *) echo "npm audit execution failed with exit code $all_status" >&2; exit "$all_status" ;;
          esac

          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/dependency-sca/npm-audit-production.json"
          production_status=$?
          set -e
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!d.metadata?.vulnerabilities || !d.vulnerabilities) throw new Error("invalid npm audit report"); console.log(`production dependencies: ${d.metadata.vulnerabilities.total} known vulnerabilities`); Object.entries(d.vulnerabilities).forEach(([name,v]) => console.log(`  ${name}: ${v.severity}`))' "$RUNNER_TEMP/dependency-sca/npm-audit-production.json"
          case "$production_status" in
            0) ;;
            1) echo "Production-dependency vulnerabilities are report-only." ;;
            *) echo "npm production audit failed with exit code $production_status" >&2; exit "$production_status" ;;
          esac
